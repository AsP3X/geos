[package]
name = "geos-core"
description = "Geos shared core: canonical Event model, config, errors, DB/storage/AI abstractions."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
schemars = { version = "1.2.1", features = ["chrono04", "uuid1"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1.23.3", features = ["serde", "v4"] }
