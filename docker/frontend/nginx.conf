server {
    listen 4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets are immutable; cache them aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entry point, so new deploys (with new asset
    # hashes) are picked up on the next normal reload instead of serving
    # a stale bundle from the browser cache.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Runtime API URL for reverse-proxy deploys (generated at container start).
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy REST + WebSocket to geos-api (Compose service name).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
