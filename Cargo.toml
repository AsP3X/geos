[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/workers",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-NebularOS-NonCommercial-1.0"
authors = ["Niklas Vorberg"]
repository = "https://github.com/AsP3X/geos"
rust-version = "1.85"

[workspace.dependencies]
geos-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
async-trait = "0.1"
futures = "0.3"
axum = { version = "0.8", features = ["macros", "ws"] }
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
http = "1"
meilisearch-sdk = "0.28"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
    "chrono",
    "uuid",
    "json",
    "derive",
] }

# Shared lint policy for every workspace crate. Mirrors rust/rust-quality.mdc
# and rust/no-allow-dead-code.mdc so violations fail the build, not just review.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
