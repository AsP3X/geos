[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/workers",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-NebularOS-NonCommercial-1.0"
authors = ["Niklas Vorberg"]
repository = "https://github.com/AsP3X/geos"
rust-version = "1.85"

[workspace.dependencies]
geos-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared lint policy for every workspace crate. Mirrors rust/rust-quality.mdc
# and rust/no-allow-dead-code.mdc so violations fail the build, not just review.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
